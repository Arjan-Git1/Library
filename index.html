<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Library</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<form id="bookForm">
    <h2>Add a Book</h2>

    <label for="bookName">Book Name</label>
    <input type="text" id="bookName" name="bookName" placeholder="Enter book name">

    <label for="bookAuthor">Author</label>
    <input type="text" id="bookAuthor" name="bookAuthor" placeholder="Enter author">

    <button type="submit" id = "submit">Add Book</button>
</form>

<button id="add">ADD BOOK</button>
<button id="display">DISPLAY</button>

<div id="card" class="card">

    <div id="cardContent" class="card-content">
        <h2 id="cardTitle">Title of the book</h2>
        <p id="author">
            author goes here
        </p>

        <button id="id">id</button>
    </div>
    <button id = "Remove">Remove</button>
    <button id="next">Next</button>

</div>

<script src="script.js"></script>
</body>
</html>
